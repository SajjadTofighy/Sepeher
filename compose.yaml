services:
  postgres:
    image: ${SEPEHR_POSTGRES_IMAGE:-postgres:17.6-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run npm run docker:init first}
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
  keycloak:
    image: ${SEPEHR_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.4}
    command: ["start", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run npm run docker:init first}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run npm run docker:init first}
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HOSTNAME_ADMIN: http://127.0.0.1:8081
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/realm-sepehr.json:/opt/keycloak/data/import/sepehr-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SEPEHR_AUTH_MODE: ${SEPEHR_AUTH_MODE:-keycloak}
      SEPEHR_AUTH_ENFORCE_ALL: ${SEPEHR_AUTH_ENFORCE_ALL:-false}
      SEPEHR_OIDC_ISSUER: ${SEPEHR_OIDC_ISSUER:-http://127.0.0.1:8080/realms/sepehr}
      SEPEHR_OIDC_JWKS_URL: http://keycloak:8080/realms/sepehr/protocol/openid-connect/certs
      SEPEHR_OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/sepehr
      SEPEHR_OIDC_AUDIENCE: sepehr-api
      SEPEHR_OIDC_CLIENTS: sepehr-web,sepehr-field
      SEPEHR_KEYCLOAK_ADMIN_URL: http://127.0.0.1:8081/admin/
      SEPEHR_AUDIT_CLIENT_SECRET: ${SEPEHR_AUDIT_CLIENT_SECRET:-}
      SEPEHR_FIELD_DB: /app/data/field.sqlite3
      SEPEHR_FIELD_TAG_BASE_URL: ${SEPEHR_FIELD_TAG_BASE_URL:-http://127.0.0.1:8000/nfc}
      SEPEHR_GIS_ORIGINS: ${SEPEHR_GIS_ORIGINS:-}
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - track-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8000:80"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    environment:
      SEPEHR_RESOURCE_ORIGINS: ${SEPEHR_RESOURCE_ORIGINS:-http://127.0.0.1:8080}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
volumes:
  track-data:
  keycloak-data:
